<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site 846 · Scientific Results</title><style>
*{box-sizing:border-box}body{margin:0;color:#193638;background:#f7f7f2;font:15px/1.55 system-ui,-apple-system,"Noto Sans CJK SC",sans-serif}header{background:#153739;color:#f8fbf5;padding:24px clamp(18px,5vw,86px);display:flex;align-items:baseline;gap:22px;flex-wrap:wrap}header h1{margin:0;font:600 clamp(28px,4vw,42px)/1.15 Georgia,serif;letter-spacing:-.035em}header span{font-size:16px;color:#d2e0d7}main{max-width:1450px;margin:0 auto;padding:25px clamp(14px,4vw,60px) 36px}a{color:#076065;text-underline-offset:3px}header a{color:#e2f1e9}nav{margin-left:auto;display:flex;gap:16px;font-size:14px}.controls{display:grid;grid-template-columns:minmax(125px,1fr) minmax(190px,1.55fr) minmax(220px,2fr);gap:14px;margin:0 0 20px}label{display:grid;gap:5px;font-size:13px;color:#516361}select,input,button{font:inherit;border:1px solid #b7c8bf;border-radius:3px;background:#fff;color:#193638;min-height:38px;padding:5px 9px;max-width:100%}select{width:100%;text-overflow:ellipsis}button{cursor:pointer}button:disabled{color:#9aa9a4;cursor:default}.paper{background:#fff;border:1px solid #d2dcd4;border-radius:4px;padding:20px;margin-bottom:18px}.paper h2{font:600 22px/1.3 system-ui;margin:0 0 8px}.paper p{margin:8px 0}.links{display:flex;gap:16px;flex-wrap:wrap}.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.bar input{width:min(100%,360px)}.bar .count{margin-left:auto;font-variant-numeric:tabular-nums}.scroll{border:1px solid #ced9d2;margin-top:10px;overflow:auto;max-height:54vh;background:white}table{border-collapse:separate;border-spacing:0;width:100%;font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}th,td{text-align:left;white-space:nowrap;padding:7px 10px;border-bottom:1px solid #e0e6df}th{position:sticky;top:0;background:#e9efea;z-index:1}tr:nth-child(even) td{background:#f6f8f4}td a{font-weight:bold}details{margin-top:10px}pre{overflow-wrap:anywhere;white-space:pre-wrap;margin:7px 0;color:#365652}summary{cursor:pointer}#record{margin-top:16px}.quiet{color:#506461}.error{color:#942c29}.pager{display:flex;gap:8px;align-items:center;margin-top:10px}@media(max-width:760px){.controls{grid-template-columns:1fr}.paper{padding:14px}.bar .count{margin-left:0}header{gap:8px 14px}nav{margin:0}.scroll{max-height:50vh}}
</style><header><h1>Site 846</h1><span>ODP Leg 138 · Scientific Results</span><nav><a href="/figure.pdf" target="_blank">图 3 原刊对照</a><a href="/api" target="_blank">JSON API</a></nav></header>
<main><div class="controls"><label>章节<select id="chapter"></select></label><label>原报告图表<select id="item"></select></label><label>数据发布版本<select id="version"></select></label></div>
<section class="paper" id="paper"></section><section id="dataPanel"><div class="bar"><input id="q" type="search" placeholder="查找样号、实验室编号或字段值" aria-label="检索当前版本"><button id="go">查找</button><a id="csv">导出 CSV</a><span class="count" id="total"></span></div>
<div class="scroll"><table id="grid"></table></div><div class="pager"><button id="prev">上一页</button><button id="next">下一页</button><span id="page"></span></div></section>
<div id="record" aria-live="polite"></div><div id="error" role="alert" class="error"></div></main>
<script>
const el=id=>document.getElementById(id), esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const get=async path=>{const res=await fetch(path);if(!res.ok)throw Error(await res.text());return res.json()};
const edition={print:'刊本转录',publisher_cd:'出版社随盘',publisher_correction:'出版社勘误',NOAA:'NOAA / 作者归档',PANGAEA:'PANGAEA'};
const kind={table:'表',figure:'图',appendix:'附录'};
let papers=[],items=[],datasets=[],offset=0,total=0,query='',request=0;const size=25;
function opt(k,v){return '<option value="'+esc(k)+'">'+esc(v)+'</option>'}
function href(u,t){return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(t)+'</a>'}
function err(e){el('error').textContent=e.message}
function currentItem(){return items.find(r=>r.item===el('item').value)}
function fillItems(preferred){const ch=Number(el('chapter').value);let options=items.filter(r=>r.chapter===ch);
 el('item').innerHTML=options.map(r=>opt(r.item,(r.kind==='appendix'?'附录 '+r.number.slice(3).toUpperCase():kind[r.kind]+' '+r.number.slice(1))+' · '+r.title)).join('');
 if(options.some(r=>r.item===preferred))el('item').value=preferred;fillVersions()}
function fillVersions(){const r=currentItem();const vs=datasets.filter(v=>v.item===r.item).sort((a,b)=>(a.edition==='print'?0:a.edition.startsWith('publisher')?1:2)-(b.edition==='print'?0:b.edition.startsWith('publisher')?1:2));
 el('version').innerHTML=vs.length?vs.map(v=>opt(v.dataset,edition[v.edition]+' · '+v.dataset+' · '+v.row_count+' 行')).join(''):opt('','原图或附件');el('version').disabled=!vs.length;showEdition()}
function showEdition(){const r=currentItem(),v=datasets.find(a=>a.dataset===el('version').value),p=papers.find(x=>x.chapter===r.chapter);offset=0;query='';el('q').value='';el('record').innerHTML='';el('error').textContent='';
 el('paper').innerHTML='<h2>'+esc(r.title)+'</h2><div class="quiet">'+esc(p.title)+'</div><p>'+esc(r.note)+'</p>'+(v?'<p>'+esc(v.description)+'</p>':'')+'<div class="links">'+href(r.pdf,'刊本 p. '+r.page_from+(r.page_to!==r.page_from?'–'+r.page_to:''))+((window.standaloneArchive)?href('sources/'+r.pdf_source+'#page='+r.pdf_page_from,'本地底本（附件包）'):'')+r.assets.map(a=>href(a.url,a.role)).join('')+(r.item==='c27_f3'?href('/figure.pdf','对照重绘'):'')+'</div>';
 el('dataPanel').hidden=!v;if(v)loadRows().catch(err);else ++request}
async function loadRows(){const token=++request,key=el('version').value;const t=await get('/api/rows/'+key+'?limit='+size+'&offset='+offset+'&q='+encodeURIComponent(query));if(token!==request)return;
 total=t.total;el('total').textContent=total.toLocaleString()+' 行';el('csv').href='/csv/'+key+'?q='+encodeURIComponent(query);el('csv').download=key+'.csv';el('prev').disabled=offset===0;el('next').disabled=offset+size>=total;el('page').textContent=total?(offset+1)+'–'+Math.min(total,offset+size):'0';
 el('grid').innerHTML='<thead><tr><th>出处</th>'+t.fields.map(f=>'<th title="'+esc(f.field+' · '+f.role)+'">'+esc(f.label+(f.unit && f.unit!=='见仓储表头'?' ('+f.unit+')':''))+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr><td><a href="#record" data-id="'+r.row_no+'">'+esc(r.source_line?'行 '+r.source_line:'p. '+r.print_page+' · '+(r.panel?r.panel+'/':'')+r.print_row)+'</a></td>'+t.fields.map(f=>'<td>'+esc(r[f.field])+'</td>').join('')+'</tr>').join('')+'</tbody>';
 el('grid').querySelectorAll('[data-id]').forEach(a=>a.onclick=e=>{e.preventDefault();showRecord(key,a.dataset.id).catch(err)});}
async function showRecord(key,id){const t=await get('/api/row/'+key+'/'+id);if(key!==el('version').value)return;const r=t.rows[0];const reviews=r.print_page?await get('/api/reviews?chapter='+t.dataset.chapter+'&page='+r.print_page+'&printed_row='+encodeURIComponent((r.panel?r.panel+'/':'')+r.print_row)):[];
 el('record').innerHTML='<section class="paper"><h2>记录 '+esc(id)+'</h2><p>'+esc(t.source.source)+' · '+esc(r.source_line?'文件行 '+r.source_line+(r.source_line_end!==r.source_line?'–'+r.source_line_end:''):'印页 '+r.print_page+(r.panel?'，第 '+r.panel+' 栏':'')+'，表内第 '+r.print_row+' 行')+'</p>'+(r.record_note?'<p>'+esc(r.record_note)+'</p>':'')+(r.raw_literal?'<pre>'+esc(r.raw_literal)+'</pre>':'')+'<div class="links">'+href(r.source_url,'打开底本')+(window.standaloneArchive?href('sources/'+t.source.source+(r.source_url.includes('#page=')?'#page='+r.source_url.split('#page=')[1]:''),'本地底本（附件包）'):'')+href('/api/row/'+key+'/'+id,'此记录的 JSON')+'</div>'+(reviews.length?'<details open><summary>校记</summary>'+reviews.map(x=>'<p>'+esc(x.field+' · 印本 '+x.print_reading+' · 仓储 '+x.repository_comparator)+'</p>').join('')+'</details>':'')+'<details><summary>来源校验值</summary><pre>'+esc(t.source.sha256)+'</pre></details></section>';el('record').scrollIntoView({behavior:'smooth',block:'nearest'})}
el('chapter').onchange=()=>fillItems();el('item').onchange=fillVersions;el('version').onchange=showEdition;
el('go').onclick=()=>{query=el('q').value.trim();offset=0;loadRows().catch(err)};el('q').onkeydown=e=>{if(e.key==='Enter')el('go').click()};el('prev').onclick=()=>{offset=Math.max(0,offset-size);loadRows().catch(err)};el('next').onclick=()=>{offset+=size;loadRows().catch(err)};
(async()=>{[papers,items,datasets]=await Promise.all([get('/api/chapters'),get('/api/items'),get('/api/datasets')]);const c=[15,27,33,43,...new Set(items.map(r=>r.chapter).filter(x=>![15,27,33,43].includes(x)))];
 el('chapter').innerHTML=c.map(i=>opt(i,'第 '+i+' 章 · '+papers.find(p=>p.chapter===i).title)).join('');el('chapter').value='27';fillItems('c27_t1')})().catch(err);
</script></html>
