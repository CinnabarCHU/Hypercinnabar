name: Compare continuous drift and changing mixture in orbital modulation
on:
  push:
    branches: [acycle-cenogrid-modulation]
    paths: ['checks/trajectory_test.m','checks/carrier_controls.m','.github/workflows/carrier-trajectory.yml']
permissions:
  contents: read
  actions: read
jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        task: [trajectory_test,carrier_controls]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mingsongli/acycle
          ref: dcba4279168745b563e0535b954297023dd62fc7
          path: upstream
          sparse-checkout: |
            code/seriesanalysis
      - uses: actions/download-artifact@v4
        with:
          run-id: 44953449635
          github-token: ${{ github.token }}
          pattern: modulation-*
          path: inputs
          merge-multiple: true
      - name: Retrieve published Site 1209 isotope measurements
        if: matrix.task == 'carrier_controls'
        shell: bash
        run: |
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/mingsongli/acycle/dcba4279168745b563e0535b954297023dd62fc7/data/Examples/Example-cenogrid-d13c.txt' -o inputs/raw_cenogrid_d13c.csv
          curl -fsSL --retry 3 'https://doi.pangaea.de/10.1594/PANGAEA.883334?format=textfile' -o inputs/1209.tab
          python - <<'PY'
          from pathlib import Path
          import csv
          data=Path('inputs/1209.tab').read_text(encoding='utf-8-sig').split('*/',1)[1]
          header,*rows=csv.reader(data.strip().splitlines(),delimiter='\t')
          fields=[3,4,5]
          print([header[i] for i in fields])
          with Path('inputs/1209.csv').open('w') as out:
              csv.writer(out).writerows([r[i] for i in fields] for r in rows if all(r[i] for i in fields))
          PY
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox Curve_Fitting_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('checks'); ${{ matrix.task }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modulation-${{ matrix.task }}
          path: model-output
          if-no-files-found: warn
