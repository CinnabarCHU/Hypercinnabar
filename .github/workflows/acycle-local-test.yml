name: Acycle local test package
on:
  push:
    branches: [acycle-local-test-0.7.0]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: Acycle-GUI-Harness
          run-id: 45193226531
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-gui
      - name: Build the local package
        run: python migration/poc/local_test/assemble.py --artifact "$RUNNER_TEMP/verified-gui" --destination "$RUNNER_TEMP/Acycle_Local_Test_0.7.0"
      - name: Install through the packaged user command
        run: python "$RUNNER_TEMP/Acycle_Local_Test_0.7.0/local_test.py" prepare
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox Image_Processing_Toolbox
      - name: Start the native display and external client
        run: |
          Xvfb :93 -screen 0 1600x1000x24 -ac -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo 'DISPLAY=:93' >> "$GITHUB_ENV"
          python -u migration/poc/local_test/ci_client.py "$RUNNER_TEMP/Acycle_Local_Test_0.7.0" > "$RUNNER_TEMP/local-client.log" 2>&1 &
      - name: Test the distributed MATLAB entry point
        uses: matlab-actions/run-command@v2
        with:
          startup-options: -display :93
          command: addpath(fullfile(pwd,'migration','poc','local_test')); cd(fullfile(getenv('RUNNER_TEMP'),'Acycle_Local_Test_0.7.0')); ci_host;
      - name: Show local test output
        if: always()
        run: if test -f "$RUNNER_TEMP/local-client.log"; then cat "$RUNNER_TEMP/local-client.log"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Acycle-Local-Test-0.7.0
          compression-level: 0
          path: ${{ runner.temp }}/Acycle_Local_Test_0.7.0.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Acycle-Local-Test-Receipts
          path: |
            ${{ runner.temp }}/local-client.log
            ${{ runner.temp }}/Acycle_Local_Test_0.7.0/generated/local-*.json
