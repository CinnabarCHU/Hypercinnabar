name: Obliquity envelopes in orbital solutions and CENOGRID
on:
  push:
    branches: [acycle-cenogrid-modulation]
    paths: ['checks/obliquity_test.m','.github/workflows/obliquity-envelopes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mingsongli/acycle
          ref: dcba4279168745b563e0535b954297023dd62fc7
          path: upstream
          sparse-checkout: |
            code/seriesanalysis
            data/Examples
      - name: Retrieve published obliquity and orbital elements
        run: |
          mkdir -p inputs
          cp upstream/data/Examples/Example-cenogrid-d13c.txt inputs/d13c_raw.txt
          cp upstream/data/Examples/Example-cenogrid-d18o.txt inputs/d18o_raw.txt
          curl -fsSL --retry 3 'https://ssp.imcce.fr/insola/earth/online/earth/La2010/La2010c_alkhqp3.dat' -o inputs/La2010c.dat
          curl -fsSL --retry 3 'https://www.soest.hawaii.edu/oceanography/faculty/zeebe_files/Astro/PrecTilt/OS/ZB18a/ems-plan3.dat' -o inputs/ems-plan3.dat
          curl -fsSL --retry 3 'https://www.soest.hawaii.edu/oceanography/faculty/zeebe_files/Astro/PrecTilt/ZB18a/asc/PT.De1.0000Td1.0000.dat' -o inputs/PT.dat
          sha256sum inputs/*.dat inputs/*_raw.txt
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox Curve_Fitting_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('checks'); obliquity_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obliquity-envelope-diagnostics
          path: tilt-output
          if-no-files-found: warn
