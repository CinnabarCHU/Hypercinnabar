name: Check the published ML96 software and Acycle 2.8
on:
  push:
    branches: [acycle-algorithm-audit]
    paths:
      - '.github/workflows/acycle-published-references.yml'
      - 'audit/algorithms/reference/*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparisons:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: CinnabarCHU/Hypercinnabar
          ref: d6b27b34597637e75fb8a1d4fe40874cf0bc1bcb
          path: benchmarks
      - uses: actions/checkout@v4
        with:
          repository: mingsongli/acycle
          ref: e3553eb00b4890c0071ef64b213df34db5670de5
          path: v28
      - name: Compile and run the Mann group FORTRAN on Lavernock
        id: mann
        continue-on-error: true
        run: python3 audit/algorithms/reference/run_mann.py
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox Optimization_Toolbox
      - uses: matlab-actions/run-command@37b454c384483087929a3d652be474ba585a9659
        with:
          command: addpath(fullfile(pwd,'audit','algorithms','reference')); runReleaseCase(pwd)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-reference-evidence
          path: reference-evidence
      - name: Check original Fortran completion
        if: steps.mann.outcome == 'failure'
        run: exit 1
