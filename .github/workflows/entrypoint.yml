name: Run the Python entry points
on:
  push:
    branches: [cenogrid-figure-reproduction]
    paths: ['.github/workflows/entrypoint.yml','main.py','versions/equivalent.json']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy scipy
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Curve_Fitting_Toolbox Statistics_and_Machine_Learning_Toolbox
      - run: |
          python ci/prepare_render.py older
          python figures/v28/S2/main.py --output "$RUNNER_TEMP/spectrum" --batch-file cli_spectrum.m
          python main.py F6 --version v28 --cached --output "$RUNNER_TEMP/wavelet" --batch-file cli_wavelet.m
          python main.py F8 --version common-records --output "$RUNNER_TEMP/literature" --batch-file cli_literature.m
      - uses: matlab-actions/run-command@v2
        with:
          command: run('cli_spectrum.m'); run('cli_wavelet.m'); run('cli_literature.m')
      - run: |
          python - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          outputs=pathlib.Path(os.environ['RUNNER_TEMP'])
          from python.size_svg import set_paper_size
          for name,fid in [('spectrum','S2'),('wavelet','F6'),('literature','F8')]:
              p=outputs/name
              assert (p/'plot.fig').stat().st_size>1000
              set_paper_size(p/'plot.svg',fid)
              assert ET.parse(p/'plot.svg').getroot().attrib['width'].endswith('mm')
          PY
