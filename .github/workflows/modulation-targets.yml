name: Test fixed orbital frequency predictions in geological envelopes
on:
  push:
    branches: [acycle-cenogrid-modulation]
    paths: ['checks/solution_targets.m','.github/workflows/modulation-targets.yml']
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mingsongli/acycle
          ref: dcba4279168745b563e0535b954297023dd62fc7
          path: upstream
          sparse-checkout: code/seriesanalysis
      - uses: actions/download-artifact@v4
        with:
          run-id: 44953449635
          github-token: ${{ github.token }}
          pattern: modulation-*
          path: inputs
          merge-multiple: true
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('checks'); solution_targets
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-orbital-frequencies
          path: target-output
