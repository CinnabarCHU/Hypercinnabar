name: Compare secular modulation estimators on public signals
on:
  push:
    branches: [acycle-cenogrid-modulation]
    paths: ['checks/compare_modulators.m','.github/workflows/cenogrid-modulator-comparison.yml']
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mingsongli/acycle
          ref: dcba4279168745b563e0535b954297023dd62fc7
          path: upstream
          sparse-checkout: code/seriesanalysis
      - uses: actions/checkout@v4
        with:
          repository: mingsongli/acycle
          ref: 1f66b1859478842ad73d1211f1fd50789ab56c00
          path: legacy
          sparse-checkout: code/seriesanalysis
      - uses: actions/download-artifact@v4
        with:
          run-id: 44953449635
          github-token: ${{ github.token }}
          pattern: modulation-*
          path: inputs
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          run-id: 44954655265
          github-token: ${{ github.token }}
          pattern: pda-bands-*
          path: inputs
          merge-multiple: true
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('checks'); compare_modulators; compare_modulators('sensitivity')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modulator-method-comparison
          path: outputs
