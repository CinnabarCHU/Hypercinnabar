name: Keyless MATLAB worker for live Harness validation
on:
  push:
    branches: [acycle-harness-live]
    paths: [harness/validation/request.json]
permissions:
  contents: read
jobs:
  matlab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Prepare checksummed request
        id: request
        run: |
          python harness/build.py "$RUNNER_TEMP/harness-src"
          python harness/validation/prepare_worker.py harness/validation/request.json "$RUNNER_TEMP/validation" "$GITHUB_WORKSPACE"
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Image_Processing_Toolbox Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox
      - name: Execute actual menu interface
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(getenv('RUNNER_TEMP'),'harness-src','matlab')); q=fullfile(getenv('RUNNER_TEMP'),'validation','request.json'); s=jsondecode(fileread(q)); fid=fopen(fullfile(s.output_dir,'matlab-started.json'),'w'); fprintf(fid,'{"started":true,"executor":"GitHub MATLAB"}'); fclose(fid); acycle_harness_menu(q,fullfile(s.output_dir,'response.json'));
      - uses: actions/upload-artifact@v4
        if: always() && steps.request.outputs.output != ''
        with:
          name: matlab-validation
          path: ${{ steps.request.outputs.output }}/
          include-hidden-files: true
          if-no-files-found: error
