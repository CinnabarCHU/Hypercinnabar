name: Compare PDA target bands in public examples
on:
  push:
    branches: [acycle-cenogrid-modulation]
    paths: ['checks/compare_pda_bands.m', '.github/workflows/cenogrid-pda-bands.yml']
permissions:
  contents: read
  actions: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        series: [d13c, d18o, ZB18a, La2010c]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mingsongli/acycle
          ref: 1f66b1859478842ad73d1211f1fd50789ab56c00
          path: historic
          sparse-checkout: |
            code/seriesanalysis
      - uses: actions/checkout@v4
        with:
          repository: mingsongli/acycle
          ref: dcba4279168745b563e0535b954297023dd62fc7
          path: upstream
          sparse-checkout: |
            data/Examples
      - uses: actions/download-artifact@v4
        if: matrix.series == 'd13c' || matrix.series == 'd18o'
        with:
          run-id: 44953449635
          github-token: ${{ github.token }}
          name: modulation-${{ matrix.series }}
          path: inputs
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('checks'); compare_pda_bands('${{ matrix.series }}')
      - uses: actions/upload-artifact@v4
        with:
          name: pda-bands-${{ matrix.series }}
          path: comparison/
