name: Draw and reopen MATLAB figures
on:
  push:
    branches: [cenogrid-figure-reproduction]
    paths: ['matlab/render_figure.m','ci/prepare_render.py','main.py','python/**','.github/workflows/render.yml','data/*.mat','data/*.xz']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  draw:
    strategy:
      fail-fast: false
      matrix:
        group: [common, baseline, older, july, august, pretag, current, frequency]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - if: matrix.group == 'frequency'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: mingsongli/acycle
          ref: 1f66b1859478842ad73d1211f1fd50789ab56c00
          path: upstream
          sparse-checkout: code
      - if: matrix.group == 'older'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: mingsongli/acycle
          ref: 7792bcc48ed8db1c12fbe99e82e4e1fce531e0e5
          path: oldcore
          sparse-checkout: code
      - if: matrix.group == 'frequency' || matrix.group == 'older'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: mingsongli/acycle
          ref: dcba4279168745b563e0535b954297023dd62fc7
          path: reference
          sparse-checkout: data
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - if: matrix.group == 'common'
        run: pip install numpy scipy
      - run: python ci/prepare_render.py ${{ matrix.group }}
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Curve_Fitting_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: batch_render
      - name: Stage generated objects
        if: always()
        run: |
          mkdir -p stage/fields
          python python/size_svg.py figures
          mkdir -p stage/figures
          while read -r p; do
            if [ -d "figures/$p" ]; then cp -R "figures/$p" stage/figures/; fi
          done < group_profiles.txt
          if [ -d fields/v2701 ]; then cp -R fields/v2701 stage/fields/; fi
          if [ -d fields/april-archiveband ]; then cp -R fields/april-archiveband stage/fields/; fi
          if [ -f fields/orbits.mat ]; then cp fields/orbits.mat stage/fields/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawings-${{ matrix.group }}
          path: stage
          if-no-files-found: error
