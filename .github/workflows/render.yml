name: Draw and reopen MATLAB figures
on:
  push:
    branches: [cenogrid-figure-reproduction]
    paths: ['matlab/render_figure.m','matlab/layout_metrics.m','ci/prepare_render.py','python/size_svg.py','.github/workflows/render.yml','fields/**']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  draw:
    strategy:
      fail-fast: false
      matrix:
        group: [common, baseline, older, july, august, pretag, current, frequency, gaussian]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python ci/prepare_render.py ${{ matrix.group }} --output stage
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox
      - uses: matlab-actions/run-command@v2
        with: {command: batch_render}
        env: {ACYCLE_LAYOUT_METRICS: '1'}
      - run: python python/size_svg.py stage
      - uses: actions/upload-artifact@v4
        with:
          name: drawings-${{ matrix.group }}
          path: stage
          retention-days: 4
          if-no-files-found: error
