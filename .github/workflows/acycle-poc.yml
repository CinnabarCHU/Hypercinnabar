name: Acycle code-only desktop
on:
  push:
    branches: [acycle-guide-free-poc]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install scipy pillow
      - name: Build and check the portable distribution
        run: |
          python migration/poc/build.py --output "$RUNNER_TEMP/acycle"
          python migration/poc/check.py "$RUNNER_TEMP/acycle"
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox Image_Processing_Toolbox Curve_Fitting_Toolbox Optimization_Toolbox Wavelet_Toolbox
      - name: Start a display for the native MATLAB windows
        shell: bash
        run: |
          if ! command -v Xvfb || ! command -v xdpyinfo || ! command -v xwininfo; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb x11-utils
          fi
          Xvfb :93 -screen 0 1600x1000x24 -ac -nolisten tcp > "$RUNNER_TEMP/acycle-xvfb.log" 2>&1 &
          for attempt in {1..30}; do
            if xdpyinfo -display :93 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          xdpyinfo -display :93 >/dev/null
          echo 'DISPLAY=:93' >> "$GITHUB_ENV"
      - name: Exercise the shipped desktop and numerical paths
        uses: matlab-actions/run-command@v2
        with:
          startup-options: -display :93
          command: addpath(fullfile(pwd,'tests')); cd(fullfile(getenv('RUNNER_TEMP'),'acycle')); test_code_only_poc;
      - uses: actions/upload-artifact@v4
        with:
          name: Acycle-GUIDE-free-PoC
          path: ${{ runner.temp }}/acycle
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Acycle-desktop-check
          path: ${{ runner.temp }}/acycle-preview.png
          if-no-files-found: error
