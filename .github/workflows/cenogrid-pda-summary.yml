name: Compare modulation in the two historical PDA bands
on:
  push:
    branches: [acycle-cenogrid-modulation]
    paths: ['checks/pda_final_checks.m', '.github/workflows/cenogrid-pda-summary.yml']
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mingsongli/acycle
          ref: dcba4279168745b563e0535b954297023dd62fc7
          path: upstream
          sparse-checkout: |
            code/package/wavelet
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
      - name: Wait for completed input calculations
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 44954655265 --exit-status --interval 15
      - uses: actions/download-artifact@v4
        with:
          run-id: 44954655265
          github-token: ${{ github.token }}
          pattern: pda-bands-*
          path: inputs
          merge-multiple: true
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('checks'); pda_final_checks
      - uses: actions/upload-artifact@v4
        with:
          name: historical-band-modulation
          path: historical-modulation.csv
