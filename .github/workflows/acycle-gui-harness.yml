name: Live Acycle GUI and Harness
on:
  push:
    branches: [acycle-harness-gui-poc]
    paths-ignore: ['tests/evidence/gui-model-action.json']
  workflow_dispatch:
    inputs:
      provider_fixture:
        type: boolean
        default: false
        description: Wait for an external model to edit the synthetic test window
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install scipy pillow build pytest
      - name: Assemble the two installed packages and the GUI
        run: |
          python migration/poc/build.py --output "$RUNNER_TEMP/acycle"
          python migration/poc/check.py "$RUNNER_TEMP/acycle"
          python harness/build.py "$RUNNER_TEMP/harness-src"
          mkdir -p "$RUNNER_TEMP/packages" "$RUNNER_TEMP/study"
          python -m build --wheel --outdir "$RUNNER_TEMP/packages" "$RUNNER_TEMP/harness-src"
          python -m pip install "$RUNNER_TEMP"/packages/*.whl
          cd "$RUNNER_TEMP/harness-src/plugin"
          npm pack --pack-destination "$RUNNER_TEMP/packages"
      - name: Install the official DeepSeek Harness tool runtime
        run: |
          version=0.2.2-rc.5
          npm install --prefix "$RUNNER_TEMP/official-dsh" --no-fund --no-audit "@deepseek-ai/dsh-tools@$version" "@deepseek-ai/dsh-system-prompt@$version" "@deepseek-ai/dsh-skill@$version" "@deepseek-ai/dsh-tool-executor-native@$version" "$RUNNER_TEMP"/packages/*.tgz
          cd "$RUNNER_TEMP/harness-src"
          ACYCLE_TEST_SOURCE="$GITHUB_WORKSPACE/upstream/master" python -m pytest -q tests
          node --test plugin/tests/{plugin,attachments,credential-boundary}.test.mjs
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox Image_Processing_Toolbox Curve_Fitting_Toolbox Optimization_Toolbox Wavelet_Toolbox
      - name: Start the virtual display for native windows
        run: |
          Xvfb :93 -screen 0 1600x1000x24 -ac -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo 'DISPLAY=:93' >> "$GITHUB_ENV"
      - name: Install the synthetic window snapshot publisher
        if: inputs.provider_fixture || contains(github.event.head_commit.message, '[gui-provider]')
        run: npm install --prefix "$RUNNER_TEMP/fixture-publisher" --no-fund --no-audit @actions/artifact@2
      - name: Publish the synthetic window while MATLAB remains open
        if: inputs.provider_fixture || contains(github.event.head_commit.message, '[gui-provider]')
        uses: actions/github-script@v7
        with:
          script: |
            const {spawn} = require('node:child_process');
            const fs = require('node:fs');
            const log = fs.openSync(process.env.RUNNER_TEMP + '/gui-publisher.log', 'w');
            spawn('node', ['tests/publish_gui_fixture.cjs'], {stdio:['ignore',log,log], detached:true}).unref();
            fs.closeSync(log);
            core.exportVariable('ACYCLE_PROVIDER_FIXTURE', '1');
      - name: Launch the external client
        run: |
          python -u tests/live_gui_client.py > "$RUNNER_TEMP/gui-client.log" 2>&1 &
      - name: Exercise the same MATLAB desktop across client calls
        uses: matlab-actions/run-command@v2
        with:
          startup-options: -display :93
          command: addpath(fullfile(pwd,'tests')); cd(fullfile(getenv('RUNNER_TEMP'),'acycle')); serve_gui_harness;
      - name: Show client results
        if: always()
        run: if test -f "$RUNNER_TEMP/gui-client.log"; then cat "$RUNNER_TEMP/gui-client.log"; fi
      - name: Run the desktop regression suite
        uses: matlab-actions/run-command@v2
        with:
          startup-options: -display :93
          command: addpath(fullfile(pwd,'tests')); cd(fullfile(getenv('RUNNER_TEMP'),'acycle')); test_code_only_poc;
      - uses: actions/upload-artifact@v4
        with:
          name: Acycle-GUI-Harness
          path: |
            ${{ runner.temp }}/packages
            ${{ runner.temp }}/acycle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Acycle-GUI-test-results
          path: |
            ${{ runner.temp }}/live-*.png
            ${{ runner.temp }}/gui-receipts.json
            ${{ runner.temp }}/gui-client.log
            ${{ runner.temp }}/gui-publisher.log
            ${{ runner.temp }}/provider-update.json
