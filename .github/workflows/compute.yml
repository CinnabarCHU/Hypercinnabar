name: Compute time series and wavelet fields
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fields:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: v27, ref: e87c233035f8fc3e71b065b5354f340ca515b0a5}
          - {label: v270, ref: 530c01748825baf1a2c802927fe25bbb0c17e022}
          - {label: v28, ref: e3553eb00b4890c0071ef64b213df34db5670de5}
          - {label: jan, ref: 1f8fd71202f2ea648d28e48e12657c6ae344ca99}
          - {label: april, ref: 1f66b1859478842ad73d1211f1fd50789ab56c00}
          - {label: v302, ref: 01e429a27f28c135d3c72fac63bf710a019be917}
          - {label: v303, ref: 8eea94423759e872a353b6a67987a58ccb0cddf8}
          - {label: aug12, ref: c67146e0af699164ab378cad5ecb0a261e221f6c}
          - {label: current, ref: dcba4279168745b563e0535b954297023dd62fc7}
          - {label: pair1, ref: 1f66b1859478842ad73d1211f1fd50789ab56c00}
          - {label: pair2, ref: 1f66b1859478842ad73d1211f1fd50789ab56c00}
          - {label: pair3, ref: 1f66b1859478842ad73d1211f1fd50789ab56c00}
          - {label: pair4, ref: 1f66b1859478842ad73d1211f1fd50789ab56c00}
          - {label: pair5, ref: 1f66b1859478842ad73d1211f1fd50789ab56c00}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: mingsongli/acycle
          ref: ${{ matrix.ref }}
          path: upstream
          sparse-checkout: code
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: mingsongli/acycle
          ref: dcba4279168745b563e0535b954297023dd62fc7
          path: reference
          sparse-checkout: data
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Curve_Fitting_Toolbox Statistics_and_Machine_Learning_Toolbox
      - uses: matlab-actions/run-command@v2
        env:
          PROFILE: ${{ matrix.label }}
        with:
          command: addpath('matlab'); p=getenv('PROFILE'); if startsWith(p,'pair'), compute_wtc(str2double(p(5:end)),fullfile(pwd,'upstream'),fullfile(pwd,'reference'),fullfile(pwd,'fields','wtc')); else, compute_fields(p,fullfile(pwd,'upstream'),fullfile(pwd,'reference'),fullfile(pwd,'fields',p)); end
      - uses: actions/upload-artifact@v4
        with:
          name: fields-${{ matrix.label }}
          path: fields
          if-no-files-found: error
