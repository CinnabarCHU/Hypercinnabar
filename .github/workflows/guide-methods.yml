name: GUIDE method migration
on:
  push:
    branches: [acycle-guide-migration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  methods:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source sections and original GUIDE controls
        run: |
          python -m pip install scipy
          python migration/check.py --figures
          python migration/master/compare.py
      - name: Export standalone methods from the pinned sources
        run: |
          python migration/export_method.py Bandpass TimeOpt Undatable --output "$RUNNER_TEMP/acycle-methods"
          python migration/export_method.py --revision master Bandpass RegularInterpolation DigitizeTrace --output "$RUNNER_TEMP/acycle-master-methods"
          (cd "$RUNNER_TEMP/acycle-master-methods" && sha256sum --check --quiet SHA256SUMS)
          cd "$RUNNER_TEMP/acycle-methods"
          sha256sum --check --quiet SHA256SUMS
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox Image_Processing_Toolbox Curve_Fitting_Toolbox Optimization_Toolbox Wavelet_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath(fullfile(pwd,'tests')); test_migration; test_desktop_methods; test_scientific_methods; test_package_portability; test_recovered_methods; test_analysis_views; test_exported_methods; test_master_migration; test_master_export; test_master_native_menu
