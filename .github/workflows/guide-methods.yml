name: GUIDE method migration
on:
  push:
    branches: [acycle-guide-migration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  methods:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox Image_Processing_Toolbox Curve_Fitting_Toolbox Optimization_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('tests'); test_migration; test_desktop_methods
