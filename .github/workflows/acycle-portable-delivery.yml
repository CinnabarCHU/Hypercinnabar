name: Acycle portable download transport
on:
  push:
    branches: [acycle-portable-delivery-0.7.1]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Acycle-Harness-Portable-macOS-arm64
          run-id: 45567586651
          repository: CinnabarCHU/Hypercinnabar
          github-token: ${{ github.token }}
          path: payload
      - name: Validate the original ZIP and split transport parts
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          file=pathlib.Path('payload/Acycle_Harness_Portable_0.7.1_arm64.zip')
          digest=hashlib.file_digest(file.open('rb'),'sha256').hexdigest()
          assert digest=='e4e8820c8cc4e3a94419cb0f93b55862e2e8338bf87f6a4f92b2af1f1aafd665'
          with zipfile.ZipFile(file) as z:
              assert z.testzip() is None
              names=z.namelist()
              root='Acycle_Harness_Portable_0.7.1_arm64/'
              assert not any(n.startswith(root+'State/') or n.startswith(root+'Workspace/generated/') for n in names)
              print('CRC and clean state verified:',len(names),'entries')
          parts=[]
          with file.open('rb') as f:
              i=0
              while chunk:=f.read(400000000):
                  part=pathlib.Path(f'part-{i:02d}.bin')
                  part.write_bytes(chunk)
                  parts.append({'file':part.name,'size':len(chunk),'sha256':hashlib.sha256(chunk).hexdigest()})
                  i+=1
          pathlib.Path('transport.json').write_text(json.dumps({'filename':file.name,'sha256':digest,'size':file.stat().st_size,'parts':parts},indent=2))
          print(pathlib.Path('transport.json').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Acycle-Portable-Transport-00
          compression-level: 0
          path: |
            part-00.bin
            transport.json
      - uses: actions/upload-artifact@v4
        with:
          name: Acycle-Portable-Transport-01
          compression-level: 0
          path: |
            part-01.bin
            transport.json
