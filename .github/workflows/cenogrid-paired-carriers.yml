name: Paired carrier tests on published isotope records and orbital solutions
on:
  push:
    branches: [acycle-cenogrid-modulation]
    paths: ['checks/paired_carriers.m', '.github/workflows/cenogrid-paired-carriers.yml']
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mingsongli/acycle
          ref: dcba4279168745b563e0535b954297023dd62fc7
          path: upstream
          sparse-checkout: |
            code/seriesanalysis
      - uses: actions/download-artifact@v4
        with:
          run-id: 44953449635
          github-token: ${{ github.token }}
          pattern: modulation-*
          path: inputs
          merge-multiple: true
      - name: Download the published axial tilt and Site 1209 benthic isotopes
        run: |
          curl -fsSL --retry 3 'https://www.soest.hawaii.edu/oceanography/faculty/zeebe_files/Astro/PrecTilt/ZB18a/asc/PT.De1.0000Td1.0000.dat' -o inputs/PT.dat
          curl -fsSL --retry 3 'https://doi.pangaea.de/10.1594/PANGAEA.883334?format=textfile' -o inputs/1209.tab
          sha256sum inputs/PT.dat inputs/1209.tab
          python - <<'PY'
          from pathlib import Path
          import csv
          data=Path('inputs/1209.tab').read_text(encoding='utf-8-sig').split('*/',1)[1]
          header,*rows=csv.reader(data.strip().splitlines(),delimiter='\t')
          fields=[3,4,5]
          print([header[i] for i in fields])
          with Path('inputs/1209.csv').open('w') as out:
              csv.writer(out).writerows([r[i] for i in fields] for r in rows if all(r[i] for i in fields))
          PY
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: Signal_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: addpath('checks'); paired_carriers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-carriers
          path: paired/
          if-no-files-found: warn
